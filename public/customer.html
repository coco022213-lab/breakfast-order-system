<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>荷香早餐店・線上點餐</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
  .name-bar{
    background:var(--white); padding:14px 16px; box-shadow:var(--shadow);
    display:flex; flex-direction:column; gap:10px; position:sticky; top:0; z-index:10;
  }
  .name-bar input{
    width:100%; border:2px solid var(--paper-deep); border-radius:10px; padding:10px 12px;
    font-size:15px; font-family:inherit;
  }
  .name-bar input:focus{ outline:none; border-color:var(--yolk); }
  .name-bar textarea{
    width:100%; border:2px solid var(--paper-deep); border-radius:10px; padding:10px 12px;
    font-size:14px; font-family:inherit; resize:none;
  }
  .name-bar textarea:focus{ outline:none; border-color:var(--yolk); }
  .type-row{ display:flex; gap:8px; }
  .type-row .pill{ flex:1; text-align:center; }

  .cat-tabs{
    display:flex; gap:8px; padding:14px 16px; overflow-x:auto;
  }
  .cat-tabs .pill{ white-space:nowrap; }

  .item-list{ padding:0 16px 140px; display:flex; flex-direction:column; gap:12px; }
  .item-card{
    background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow);
    padding:14px 16px; display:flex; align-items:center; gap:12px; cursor:pointer; border:2px solid transparent;
  }
  .item-card:active{ border-color:var(--yolk); }
  .item-card .info{ flex:1; }
  .item-card .name{ font-weight:700; font-size:15px; }
  .item-card .price{ color:var(--chili); font-weight:900; font-size:14px; margin-top:2px; }

  .cart-bar{
    position:fixed; bottom:0; left:0; right:0; background:var(--ink); color:var(--paper);
    padding:14px 16px; display:flex; align-items:center; justify-content:space-between;
    box-shadow:0 -4px 14px rgba(0,0,0,.2);
  }
  .cart-bar .count{ font-size:13px; opacity:.8; }
  .cart-bar .amount{ font-size:20px; font-weight:900; color:var(--yolk); }
  .cart-bar button{ background:var(--yolk); color:var(--ink); }

  .modal-head{ display:flex; justify-content:flex-end; align-items:flex-start; }
  .modal h3{ font-size:20px; margin:4px 0 2px; font-weight:900; }
  .modal .base-price{ color:var(--chili); font-weight:900; font-size:15px; margin-bottom:16px; }
  .close-x{ background:var(--paper); border:none; width:30px; height:30px; border-radius:100px; font-size:16px; cursor:pointer; color:var(--ink-soft); }
  .opt-group{ margin-bottom:16px; }
  .opt-group .glabel{ font-weight:700; font-size:13px; color:var(--ink-soft); margin-bottom:8px; display:block; }
  .pill-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .qty-row{ display:flex; align-items:center; justify-content:space-between; margin:18px 0 6px; }
  .qty-row .glabel{ font-weight:700; font-size:13px; color:var(--ink-soft); }
  .qty-ctrl{ display:flex; align-items:center; gap:14px; }
  .qty-ctrl button{ width:34px; height:34px; border-radius:100px; border:none; background:var(--paper-deep); font-size:18px; font-weight:900; cursor:pointer; color:var(--ink); }
  .qty-ctrl span{ font-weight:900; font-size:16px; min-width:20px; text-align:center; }

  /* cart review modal */
  .cart-line{ background:var(--paper); border-radius:10px; padding:10px 12px; margin-bottom:8px; position:relative; }
  .cart-line .row1{ display:flex; justify-content:space-between; }
  .cart-line .iname{ font-weight:700; font-size:14px; }
  .cart-line .iprice{ font-weight:900; color:var(--chili); }
  .cart-line .opts{ font-size:12px; color:var(--chili-deep); font-weight:700; margin-top:4px; }
  .cart-line .remove{ position:absolute; top:6px; right:6px; background:none; border:none; color:var(--ink-soft); font-size:14px; cursor:pointer; }
  .cart-total-row{ display:flex; justify-content:space-between; align-items:center; border-top:2px dashed var(--paper-deep); margin-top:12px; padding-top:12px; }
  .cart-total-row .amount{ font-size:24px; font-weight:900; color:var(--chili); }

  .empty-state{ text-align:center; padding:60px 20px; color:var(--ink-soft); }

  /* order status tracking view */
  #statusView{ display:none; min-height:100vh; align-items:center; justify-content:center; padding:20px; }
  .status-card{
    background:var(--white); border-radius:22px; padding:36px 26px; max-width:380px; width:100%;
    text-align:center; box-shadow:var(--shadow);
  }
  .status-icon{ font-size:56px; margin-bottom:10px; }
  .status-title{ font-size:20px; font-weight:900; margin-bottom:6px; }
  .status-num{ font-size:44px; font-weight:900; color:var(--chili); margin:10px 0; }
  .status-sub{ font-size:13px; color:var(--ink-soft); margin-bottom:20px; }
  .status-items{ background:var(--paper); border-radius:12px; padding:14px; text-align:left; margin-bottom:18px; }
  .status-items .sline{ font-size:13px; font-weight:700; margin-bottom:6px; }
  .status-items .sline:last-child{ margin-bottom:0; }
  .status-items .sopts{ font-size:12px; color:var(--chili-deep); font-weight:700; margin-left:8px; }
  .status-total{ display:flex; justify-content:space-between; border-top:2px dashed var(--paper-deep); margin-top:10px; padding-top:10px; font-weight:900; }
  .status-badge{
    display:inline-block; font-size:12px; font-weight:900; padding:5px 14px; border-radius:100px; margin-bottom:16px;
  }
  .status-badge.pending{ background:rgba(240,165,0,0.18); color:#B87800; }
  .status-badge.ready{ background:rgba(79,111,63,0.2); color:var(--scallion-deep); }
  .status-badge.paid{ background:rgba(79,111,63,0.18); color:var(--scallion-deep); }
  .status-badge.cancelled{ background:rgba(194,54,22,0.15); color:var(--chili-deep); }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .status-icon.spinning{ display:inline-block; animation:spin 2s linear infinite; }
  .status-links{ margin-top:10px; }
  .status-links a{ color:var(--ink-soft); font-size:12px; font-weight:700; text-decoration:underline; cursor:pointer; }

  .history-btn{
    background:rgba(255,255,255,0.12); border:none; color:var(--paper); font-family:inherit;
    font-size:12px; font-weight:700; padding:8px 14px; border-radius:100px; cursor:pointer;
  }
  .history-row{
    background:var(--paper); border-radius:10px; padding:12px 14px; margin-bottom:8px;
  }
  .history-row .hrow1{ display:flex; justify-content:space-between; align-items:center; }
  .history-row .hnum{ font-weight:900; font-size:14px; }
  .history-row .htime{ font-size:11px; color:var(--ink-soft); }
  .history-row .hitems{ font-size:12px; color:var(--ink-soft); margin-top:4px; }
  .history-row .hbottom{ display:flex; justify-content:space-between; align-items:center; margin-top:6px; }
  .history-row .hamount{ font-weight:900; color:var(--chili); font-size:13px; }
</style>
</head>
<body>

<div id="orderingView">
<div class="topbar">
  <div>
    <h1>🍳 荷香早餐店</h1>
    <div class="sub">線上點餐，現場取餐付款</div>
  </div>
  <button class="history-btn" id="historyBtn">📋 我的訂單紀錄</button>
</div>

<div class="name-bar">
  <div class="type-row">
    <button class="pill selected" id="typeDineIn" data-type="dine-in">🍽️ 內用</button>
    <button class="pill" id="typeTakeout" data-type="takeout">🥡 外帶自取</button>
  </div>
  <input id="customerName" type="text" placeholder="請輸入姓名或桌號，方便叫號取餐" maxlength="12">
  <input id="customerPhone" type="tel" placeholder="電話號碼（選填，方便通知取餐）" maxlength="15" style="display:none;">
  <textarea id="orderNote" placeholder="備註（選填，例如：不要洋蔥）" rows="2" maxlength="80"></textarea>
</div>

<div class="cat-tabs" id="catTabs"></div>
<div class="item-list" id="itemList"></div>

<div class="cart-bar">
  <div>
    <div class="count" id="cartCount">尚未選購</div>
    <div class="amount" id="cartAmount">$0</div>
  </div>
  <button class="btn" id="viewCartBtn">查看訂單</button>
</div>
</div>

<div id="statusView">
  <div class="status-card" id="statusCard"></div>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modalBody"></div></div>
<div class="overlay" id="cartOverlay"><div class="modal" id="cartModalBody"></div></div>
<div class="overlay" id="historyOverlay"><div class="modal" id="historyModalBody"></div></div>
<div class="toast" id="toast"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
let MENU = [];
let categories = [];
let activeCat = '';
let cart = [];
let currentItem = null, currentSelections = {}, currentQty = 1;
let orderType = 'dine-in';

document.getElementById('typeDineIn').onclick = () => setOrderType('dine-in');
document.getElementById('typeTakeout').onclick = () => setOrderType('takeout');
function setOrderType(type){
  orderType = type;
  document.getElementById('typeDineIn').classList.toggle('selected', type === 'dine-in');
  document.getElementById('typeTakeout').classList.toggle('selected', type === 'takeout');
  document.getElementById('customerName').placeholder = type === 'dine-in' ? '請輸入桌號或姓名' : '請輸入姓名，方便叫號取餐';
  document.getElementById('customerPhone').style.display = type === 'takeout' ? 'block' : 'none';
}

async function loadMenu(){
  const res = await fetch('/api/menu');
  MENU = await res.json();
  categories = [...new Set(MENU.map(i => i.category))];
  activeCat = categories[0] || '';
  renderCatTabs();
  renderItemList();
}

function renderCatTabs(){
  const wrap = document.getElementById('catTabs');
  wrap.innerHTML = '';
  categories.forEach(c => {
    const catEmoji = (MENU.find(i => i.category === c) || {}).emoji || '🍽️';
    const b = document.createElement('button');
    b.className = 'pill' + (c === activeCat ? ' selected' : '');
    b.textContent = `${catEmoji} ${c}`;
    b.onclick = () => { activeCat = c; renderCatTabs(); renderItemList(); };
    wrap.appendChild(b);
  });
}

function renderItemList(){
  const wrap = document.getElementById('itemList');
  const items = MENU.filter(i => i.category === activeCat);
  if(items.length === 0){
    wrap.innerHTML = '<div class="empty-state">這個分類目前沒有品項</div>';
    return;
  }
  wrap.innerHTML = '';
  items.forEach(item => {
    const el = document.createElement('div');
    el.className = 'item-card';
    el.innerHTML = `<div class="info"><div class="name">${item.name}</div><div class="price">$${item.price}</div></div>`;
    el.onclick = () => openModal(item);
    wrap.appendChild(el);
  });
}

function calcExtra(){
  let extra = 0;
  currentItem.groups.forEach(g => {
    if(g.type === 'single'){
      const opt = g.options.find(o => o.v === currentSelections[g.key]);
      if(opt) extra += opt.extra;
    } else {
      (currentSelections[g.key]||[]).forEach(v => {
        const opt = g.options.find(o => o.v === v);
        if(opt) extra += opt.extra;
      });
    }
  });
  return extra;
}

function openModal(item){
  currentItem = item; currentSelections = {}; currentQty = 1;
  (item.groups||[]).forEach(g => {
    currentSelections[g.key] = g.type === 'single' ? (g.default || g.options[0].v) : [];
  });
  renderModal();
  document.getElementById('overlay').classList.add('active');
}
function closeModal(){ document.getElementById('overlay').classList.remove('active'); }
document.getElementById('overlay').addEventListener('click', e => { if(e.target.id==='overlay') closeModal(); });

function renderModal(){
  const extra = calcExtra();
  const unitPrice = currentItem.price + extra;
  let groupsHtml = '';
  (currentItem.groups||[]).forEach(g => {
    let pills = '';
    g.options.forEach(o => {
      const isSel = g.type === 'single' ? currentSelections[g.key] === o.v : (currentSelections[g.key]||[]).includes(o.v);
      pills += `<button class="pill ${isSel?'selected':''} ${g.key==='spicy'&&o.v!=='不辣'?'chili-pill':''}" data-group="${g.key}" data-val="${o.v}" data-type="${g.type}">${o.v}${o.extra?' +'+o.extra:''}</button>`;
    });
    groupsHtml += `<div class="opt-group"><span class="glabel">${g.label}</span><div class="pill-row">${pills}</div></div>`;
  });
  document.getElementById('modalBody').innerHTML = `
    <div class="modal-head"><button class="close-x" id="modalClose">✕</button></div>
    <h3>${currentItem.name}</h3>
    <div class="base-price">$${unitPrice}</div>
    ${groupsHtml}
    <div class="qty-row"><span class="glabel">數量</span>
      <div class="qty-ctrl"><button id="qtyMinus">－</button><span>${currentQty}</span><button id="qtyPlus">＋</button></div>
    </div>
    <button class="btn btn-primary" style="width:100%;margin-top:14px;" id="addCartBtn">加入訂單・$${unitPrice*currentQty}</button>
  `;
  document.getElementById('modalClose').onclick = closeModal;
  document.getElementById('qtyMinus').onclick = () => { if(currentQty>1){currentQty--; renderModal();} };
  document.getElementById('qtyPlus').onclick = () => { currentQty++; renderModal(); };
  document.getElementById('addCartBtn').onclick = addToCart;
  document.querySelectorAll('#modalBody .pill').forEach(p => {
    p.onclick = () => {
      const key=p.dataset.group, val=p.dataset.val, type=p.dataset.type;
      if(type==='single'){ currentSelections[key]=val; }
      else{ const arr=currentSelections[key]; const idx=arr.indexOf(val); if(idx>-1) arr.splice(idx,1); else arr.push(val); }
      renderModal();
    };
  });
}

function addToCart(){
  const extra = calcExtra();
  const unitPrice = currentItem.price + extra;
  const opts = [];
  (currentItem.groups||[]).forEach(g => {
    if(g.type==='single'){ if(currentSelections[g.key]) opts.push(currentSelections[g.key]); }
    else{ (currentSelections[g.key]||[]).forEach(v=>opts.push(v)); }
  });
  cart.push({ name: currentItem.name, emoji: currentItem.emoji, qty: currentQty, unitPrice, opts });
  closeModal();
  updateCartBar();
  showToast(`已加入 ${currentItem.name} x${currentQty}`);
}

function updateCartBar(){
  const count = cart.reduce((s,c)=>s+c.qty,0);
  const total = cart.reduce((s,c)=>s+c.unitPrice*c.qty,0);
  document.getElementById('cartCount').textContent = count>0 ? `共 ${count} 項` : '尚未選購';
  document.getElementById('cartAmount').textContent = '$'+total;
}

document.getElementById('viewCartBtn').onclick = renderCartModal;
function renderCartModal(){
  const total = cart.reduce((s,c)=>s+c.unitPrice*c.qty,0);
  let linesHtml = cart.length===0 ? '<div class="empty-state">尚未選購任何餐點</div>' : cart.map((c,idx)=>`
    <div class="cart-line">
      <button class="remove" data-idx="${idx}">✕</button>
      <div class="row1"><span class="iname">${c.name} x${c.qty}</span><span class="iprice">$${c.unitPrice*c.qty}</span></div>
      ${c.opts.length?`<div class="opts">${c.opts.join('・')}</div>`:''}
    </div>`).join('');
  document.getElementById('cartModalBody').innerHTML = `
    <div class="modal-head"><h3 style="margin:0;">我的訂單</h3><button class="close-x" id="cartClose">✕</button></div>
    <div style="margin-top:14px;">${linesHtml}</div>
    ${cart.length>0?`<div class="cart-total-row"><span>總計</span><span class="amount">$${total}</span></div>`:''}
    <button class="btn btn-primary" style="width:100%;margin-top:16px;" id="submitOrderBtn" ${cart.length===0?'disabled':''}>送出訂單</button>
  `;
  document.getElementById('cartOverlay').classList.add('active');
  document.getElementById('cartClose').onclick = () => document.getElementById('cartOverlay').classList.remove('active');
  document.querySelectorAll('#cartModalBody .remove').forEach(btn=>{
    btn.onclick = () => { cart.splice(+btn.dataset.idx,1); updateCartBar(); renderCartModal(); };
  });
  const submitBtn = document.getElementById('submitOrderBtn');
  if(submitBtn) submitBtn.onclick = submitOrder;
}
document.getElementById('cartOverlay').addEventListener('click', e=>{ if(e.target.id==='cartOverlay') document.getElementById('cartOverlay').classList.remove('active'); });

async function submitOrder(){
  const name = document.getElementById('customerName').value.trim();
  if(!name){
    showToast('請先輸入姓名或桌號');
    document.getElementById('cartOverlay').classList.remove('active');
    document.getElementById('customerName').focus();
    return;
  }
  const res = await fetch('/api/orders', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      customerName: name,
      customerPhone: document.getElementById('customerPhone').value.trim(),
      note: document.getElementById('orderNote').value.trim(),
      items: cart,
      orderType
    })
  });
  if(!res.ok){ showToast('送出失敗，請再試一次'); return; }
  const order = await res.json();
  unlockAudio();
  cart = [];
  updateCartBar();
  document.getElementById('orderNote').value = '';
  document.getElementById('cartOverlay').classList.remove('active');
  sessionStorage.setItem('trackedOrderId', order.id);
  rememberOrderId(order.id);
  showOrderStatus(order);
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

// ---------------- 訂單狀態追蹤 ----------------
const socket = io();
let trackedOrder = null;
let audioCtx = null;

function unlockAudio(){
  if(!audioCtx){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if(audioCtx.state === 'suspended') audioCtx.resume();
}

function playChime(){
  if(!audioCtx) return;
  const now = audioCtx.currentTime;
  [880, 1175].forEach((freq, i) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, now + i * 0.18);
    gain.gain.linearRampToValueAtTime(0.3, now + i * 0.18 + 0.03);
    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.18 + 0.35);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now + i * 0.18);
    osc.stop(now + i * 0.18 + 0.4);
  });
}

function statusMeta(order){
  if(order.status === 'paid'){
    return { icon:'✅', spinning:false, badgeClass:'paid', badgeText:'已完成取餐', title:'餐點已經取用完成囉！' };
  }
  if(order.status === 'ready'){
    return { icon:'🔔', spinning:false, badgeClass:'ready', badgeText:'可以取餐了',
      title: order.orderType === 'takeout' ? '餐點已經好了，可以來取餐囉！' : '餐點已經好了！' };
  }
  if(order.status === 'cancelled'){
    return { icon:'❌', spinning:false, badgeClass:'cancelled', badgeText:'訂單已取消', title:'這筆訂單已被取消' };
  }
  return { icon:'🧑‍🍳', spinning:true, badgeClass:'pending', badgeText:'製作中', title:'餐點準備中，請稍候' };
}

function showOrderStatus(order){
  trackedOrder = order;
  document.getElementById('orderingView').style.display = 'none';
  document.getElementById('statusView').style.display = 'flex';
  renderStatusCard();
}

function renderStatusCard(){
  const order = trackedOrder;
  const meta = statusMeta(order);
  const itemsHtml = order.items.map(it => `
    <div class="sline">${it.name} x${it.qty}${it.opts && it.opts.length ? `<span class="sopts">${it.opts.join('・')}</span>` : ''}</div>
  `).join('');
  document.getElementById('statusCard').innerHTML = `
    <span class="status-badge ${meta.badgeClass}">${meta.badgeText}</span>
    <div class="status-icon ${meta.spinning?'spinning':''}">${meta.icon}</div>
    <div class="status-title">${meta.title}</div>
    <div class="status-num">No. ${String(order.num).padStart(2,'0')}</div>
    <div class="status-sub">${order.orderType === 'takeout' ? '🥡 外帶自取' : '🍽️ 內用'}・${order.customerName}${order.customerPhone ? '・'+order.customerPhone : ''}</div>
    <div class="status-items">
      ${order.note ? `<div class="sline" style="color:var(--chili-deep);">📝 ${order.note}</div>` : ''}
      ${itemsHtml}
      <div class="status-total"><span>總計</span><span>$${order.total}</span></div>
    </div>
    <button class="btn btn-primary" style="width:100%;" id="newOrderBtn">🍳 我要再點一份</button>
    <div class="status-links"><a id="viewHistoryLink">📋 查看我的訂單紀錄</a></div>
  `;
  document.getElementById('newOrderBtn').onclick = () => {
    sessionStorage.removeItem('trackedOrderId');
    trackedOrder = null;
    document.getElementById('statusView').style.display = 'none';
    document.getElementById('orderingView').style.display = 'block';
  };
  document.getElementById('viewHistoryLink').onclick = openHistory;
}

socket.on('order_ready', (order) => {
  if(trackedOrder && order.id === trackedOrder.id){
    trackedOrder = order;
    renderStatusCard();
    playChime();
  }
});
socket.on('order_paid', ({ order }) => {
  if(trackedOrder && order.id === trackedOrder.id){
    trackedOrder = order;
    renderStatusCard();
  }
});
socket.on('order_undone', ({ order }) => {
  if(trackedOrder && order.id === trackedOrder.id){
    trackedOrder = order;
    renderStatusCard();
  }
});
socket.on('order_cancelled', (order) => {
  if(trackedOrder && order.id === trackedOrder.id){
    trackedOrder = order;
    renderStatusCard();
  }
});

async function checkTrackedOrder(){
  const savedId = sessionStorage.getItem('trackedOrderId');
  if(!savedId) return false;
  try{
    const res = await fetch(`/api/orders/${savedId}`);
    if(!res.ok){ sessionStorage.removeItem('trackedOrderId'); return false; }
    const order = await res.json();
    showOrderStatus(order);
    return true;
  } catch(e){
    return false;
  }
}

// ---------------- 我的訂單紀錄（記在這台裝置的瀏覽器裡，最多保留 20 筆） ----------------
const HISTORY_LIMIT = 20;

function rememberOrderId(id){
  const ids = JSON.parse(localStorage.getItem('myOrderIds') || '[]');
  const updated = [id, ...ids.filter(x => x !== id)].slice(0, HISTORY_LIMIT);
  localStorage.setItem('myOrderIds', JSON.stringify(updated));
}

document.getElementById('historyBtn').onclick = openHistory;

async function openHistory(){
  const ids = JSON.parse(localStorage.getItem('myOrderIds') || '[]');
  const modal = document.getElementById('historyModalBody');
  if(ids.length === 0){
    modal.innerHTML = `
      <div class="modal-head"><h3 style="margin:0;">我的訂單紀錄</h3><button class="close-x" id="historyClose">✕</button></div>
      <div class="empty-state">這台裝置還沒有點餐紀錄</div>
    `;
    document.getElementById('historyOverlay').classList.add('active');
    document.getElementById('historyClose').onclick = () => document.getElementById('historyOverlay').classList.remove('active');
    return;
  }
  modal.innerHTML = `
    <div class="modal-head"><h3 style="margin:0;">我的訂單紀錄</h3><button class="close-x" id="historyClose">✕</button></div>
    <div id="historyList" style="margin-top:14px;"><div class="empty-state">載入中…</div></div>
  `;
  document.getElementById('historyOverlay').classList.add('active');
  document.getElementById('historyClose').onclick = () => document.getElementById('historyOverlay').classList.remove('active');

  const results = await Promise.all(ids.map(id => fetch(`/api/orders/${id}`).then(r => r.ok ? r.json() : null).catch(()=>null)));
  const validOrders = results.filter(Boolean).sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
  const list = document.getElementById('historyList');
  if(!list) return; // 使用者可能已經關掉視窗
  if(validOrders.length === 0){
    list.innerHTML = '<div class="empty-state">找不到訂單紀錄</div>';
    return;
  }
  list.innerHTML = validOrders.map(o => {
    const meta = statusMeta(o);
    const time = new Date(o.createdAt).toLocaleString('zh-TW', {month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'});
    const itemsText = o.items.map(it => `${it.name}x${it.qty}`).join('、');
    return `
      <div class="history-row">
        <div class="hrow1">
          <span class="hnum">No.${String(o.num).padStart(2,'0')}</span>
          <span class="status-badge ${meta.badgeClass}" style="margin-bottom:0;">${meta.badgeText}</span>
        </div>
        <div class="hitems">${itemsText}</div>
        <div class="hbottom">
          <span class="htime">${time}</span>
          <span class="hamount">$${o.total}</span>
        </div>
      </div>
    `;
  }).join('');
}

(async () => {
  const isTracking = await checkTrackedOrder();
  if(!isTracking) loadMenu();
})();
