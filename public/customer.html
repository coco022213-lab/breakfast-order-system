<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>荷香早餐店・線上點餐</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
  .name-bar{
    background:var(--white); padding:14px 16px; box-shadow:var(--shadow);
    display:flex; gap:10px; align-items:center; position:sticky; top:0; z-index:10;
  }
  .name-bar input{
    flex:1; border:2px solid var(--paper-deep); border-radius:10px; padding:10px 12px;
    font-size:15px; font-family:inherit;
  }
  .name-bar input:focus{ outline:none; border-color:var(--yolk); }

  .cat-tabs{
    display:flex; gap:8px; padding:14px 16px; overflow-x:auto;
  }
  .cat-tabs .pill{ white-space:nowrap; }

  .item-list{ padding:0 16px 140px; display:flex; flex-direction:column; gap:12px; }
  .item-card{
    background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow);
    padding:14px; display:flex; align-items:center; gap:12px; cursor:pointer; border:2px solid transparent;
  }
  .item-card:active{ border-color:var(--yolk); }
  .item-card .emoji{ font-size:32px; }
  .item-card .info{ flex:1; }
  .item-card .name{ font-weight:700; font-size:15px; }
  .item-card .price{ color:var(--chili); font-weight:900; font-size:14px; margin-top:2px; }

  .cart-bar{
    position:fixed; bottom:0; left:0; right:0; background:var(--ink); color:var(--paper);
    padding:14px 16px; display:flex; align-items:center; justify-content:space-between;
    box-shadow:0 -4px 14px rgba(0,0,0,.2);
  }
  .cart-bar .count{ font-size:13px; opacity:.8; }
  .cart-bar .amount{ font-size:20px; font-weight:900; color:var(--yolk); }
  .cart-bar button{ background:var(--yolk); color:var(--ink); }

  .modal-head{ display:flex; justify-content:space-between; align-items:flex-start; }
  .modal-head .emoji{ font-size:40px; }
  .modal h3{ font-size:20px; margin:8px 0 2px; font-weight:900; }
  .modal .base-price{ color:var(--chili); font-weight:900; font-size:15px; margin-bottom:16px; }
  .close-x{ background:var(--paper); border:none; width:30px; height:30px; border-radius:100px; font-size:16px; cursor:pointer; color:var(--ink-soft); }
  .opt-group{ margin-bottom:16px; }
  .opt-group .glabel{ font-weight:700; font-size:13px; color:var(--ink-soft); margin-bottom:8px; display:block; }
  .pill-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .qty-row{ display:flex; align-items:center; justify-content:space-between; margin:18px 0 6px; }
  .qty-row .glabel{ font-weight:700; font-size:13px; color:var(--ink-soft); }
  .qty-ctrl{ display:flex; align-items:center; gap:14px; }
  .qty-ctrl button{ width:34px; height:34px; border-radius:100px; border:none; background:var(--paper-deep); font-size:18px; font-weight:900; cursor:pointer; color:var(--ink); }
  .qty-ctrl span{ font-weight:900; font-size:16px; min-width:20px; text-align:center; }

  /* cart review modal */
  .cart-line{ background:var(--paper); border-radius:10px; padding:10px 12px; margin-bottom:8px; position:relative; }
  .cart-line .row1{ display:flex; justify-content:space-between; }
  .cart-line .iname{ font-weight:700; font-size:14px; }
  .cart-line .iprice{ font-weight:900; color:var(--chili); }
  .cart-line .opts{ font-size:12px; color:var(--chili-deep); font-weight:700; margin-top:4px; }
  .cart-line .remove{ position:absolute; top:6px; right:6px; background:none; border:none; color:var(--ink-soft); font-size:14px; cursor:pointer; }
  .cart-total-row{ display:flex; justify-content:space-between; align-items:center; border-top:2px dashed var(--paper-deep); margin-top:12px; padding-top:12px; }
  .cart-total-row .amount{ font-size:24px; font-weight:900; color:var(--chili); }

  .empty-state{ text-align:center; padding:60px 20px; color:var(--ink-soft); }
</style>
</head>
<body>

<div class="topbar">
  <div>
    <h1>🍳 荷香早餐店</h1>
    <div class="sub">線上點餐，現場取餐付款</div>
  </div>
</div>

<div class="name-bar">
  <input id="customerName" type="text" placeholder="請輸入姓名或桌號，方便叫號取餐" maxlength="12">
</div>

<div class="cat-tabs" id="catTabs"></div>
<div class="item-list" id="itemList"></div>

<div class="cart-bar">
  <div>
    <div class="count" id="cartCount">尚未選購</div>
    <div class="amount" id="cartAmount">$0</div>
  </div>
  <button class="btn" id="viewCartBtn">查看訂單</button>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modalBody"></div></div>
<div class="overlay" id="cartOverlay"><div class="modal" id="cartModalBody"></div></div>
<div class="toast" id="toast"></div>

<script>
let MENU = [];
let categories = [];
let activeCat = '';
let cart = [];
let currentItem = null, currentSelections = {}, currentQty = 1;

async function loadMenu(){
  const res = await fetch('/api/menu');
  MENU = await res.json();
  categories = [...new Set(MENU.map(i => i.category))];
  activeCat = categories[0] || '';
  renderCatTabs();
  renderItemList();
}

function renderCatTabs(){
  const wrap = document.getElementById('catTabs');
  wrap.innerHTML = '';
  categories.forEach(c => {
    const b = document.createElement('button');
    b.className = 'pill' + (c === activeCat ? ' selected' : '');
    b.textContent = c;
    b.onclick = () => { activeCat = c; renderCatTabs(); renderItemList(); };
    wrap.appendChild(b);
  });
}

function renderItemList(){
  const wrap = document.getElementById('itemList');
  const items = MENU.filter(i => i.category === activeCat);
  if(items.length === 0){
    wrap.innerHTML = '<div class="empty-state">這個分類目前沒有品項</div>';
    return;
  }
  wrap.innerHTML = '';
  items.forEach(item => {
    const el = document.createElement('div');
    el.className = 'item-card';
    el.innerHTML = `<span class="emoji">${item.emoji||'🍽️'}</span>
      <div class="info"><div class="name">${item.name}</div><div class="price">$${item.price}</div></div>`;
    el.onclick = () => openModal(item);
    wrap.appendChild(el);
  });
}

function calcExtra(){
  let extra = 0;
  currentItem.groups.forEach(g => {
    if(g.type === 'single'){
      const opt = g.options.find(o => o.v === currentSelections[g.key]);
      if(opt) extra += opt.extra;
    } else {
      (currentSelections[g.key]||[]).forEach(v => {
        const opt = g.options.find(o => o.v === v);
        if(opt) extra += opt.extra;
      });
    }
  });
  return extra;
}

function openModal(item){
  currentItem = item; currentSelections = {}; currentQty = 1;
  (item.groups||[]).forEach(g => {
    currentSelections[g.key] = g.type === 'single' ? (g.default || g.options[0].v) : [];
  });
  renderModal();
  document.getElementById('overlay').classList.add('active');
}
function closeModal(){ document.getElementById('overlay').classList.remove('active'); }
document.getElementById('overlay').addEventListener('click', e => { if(e.target.id==='overlay') closeModal(); });

function renderModal(){
  const extra = calcExtra();
  const unitPrice = currentItem.price + extra;
  let groupsHtml = '';
  (currentItem.groups||[]).forEach(g => {
    let pills = '';
    g.options.forEach(o => {
      const isSel = g.type === 'single' ? currentSelections[g.key] === o.v : (currentSelections[g.key]||[]).includes(o.v);
      pills += `<button class="pill ${isSel?'selected':''} ${g.key==='spicy'&&o.v!=='不辣'?'chili-pill':''}" data-group="${g.key}" data-val="${o.v}" data-type="${g.type}">${o.v}${o.extra?' +'+o.extra:''}</button>`;
    });
    groupsHtml += `<div class="opt-group"><span class="glabel">${g.label}</span><div class="pill-row">${pills}</div></div>`;
  });
  document.getElementById('modalBody').innerHTML = `
    <div class="modal-head"><div class="emoji">${currentItem.emoji||'🍽️'}</div><button class="close-x" id="modalClose">✕</button></div>
    <h3>${currentItem.name}</h3>
    <div class="base-price">$${unitPrice}</div>
    ${groupsHtml}
    <div class="qty-row"><span class="glabel">數量</span>
      <div class="qty-ctrl"><button id="qtyMinus">－</button><span>${currentQty}</span><button id="qtyPlus">＋</button></div>
    </div>
    <button class="btn btn-primary" style="width:100%;margin-top:14px;" id="addCartBtn">加入訂單・$${unitPrice*currentQty}</button>
  `;
  document.getElementById('modalClose').onclick = closeModal;
  document.getElementById('qtyMinus').onclick = () => { if(currentQty>1){currentQty--; renderModal();} };
  document.getElementById('qtyPlus').onclick = () => { currentQty++; renderModal(); };
  document.getElementById('addCartBtn').onclick = addToCart;
  document.querySelectorAll('#modalBody .pill').forEach(p => {
    p.onclick = () => {
      const key=p.dataset.group, val=p.dataset.val, type=p.dataset.type;
      if(type==='single'){ currentSelections[key]=val; }
      else{ const arr=currentSelections[key]; const idx=arr.indexOf(val); if(idx>-1) arr.splice(idx,1); else arr.push(val); }
      renderModal();
    };
  });
}

function addToCart(){
  const extra = calcExtra();
  const unitPrice = currentItem.price + extra;
  const opts = [];
  (currentItem.groups||[]).forEach(g => {
    if(g.type==='single'){ if(currentSelections[g.key]) opts.push(currentSelections[g.key]); }
    else{ (currentSelections[g.key]||[]).forEach(v=>opts.push(v)); }
  });
  cart.push({ name: currentItem.name, emoji: currentItem.emoji, qty: currentQty, unitPrice, opts });
  closeModal();
  updateCartBar();
  showToast(`已加入 ${currentItem.name} x${currentQty}`);
}

function updateCartBar(){
  const count = cart.reduce((s,c)=>s+c.qty,0);
  const total = cart.reduce((s,c)=>s+c.unitPrice*c.qty,0);
  document.getElementById('cartCount').textContent = count>0 ? `共 ${count} 項` : '尚未選購';
  document.getElementById('cartAmount').textContent = '$'+total;
}

document.getElementById('viewCartBtn').onclick = renderCartModal;
function renderCartModal(){
  const total = cart.reduce((s,c)=>s+c.unitPrice*c.qty,0);
  let linesHtml = cart.length===0 ? '<div class="empty-state">尚未選購任何餐點</div>' : cart.map((c,idx)=>`
    <div class="cart-line">
      <button class="remove" data-idx="${idx}">✕</button>
      <div class="row1"><span class="iname">${c.emoji||''} ${c.name} x${c.qty}</span><span class="iprice">$${c.unitPrice*c.qty}</span></div>
      ${c.opts.length?`<div class="opts">${c.opts.join('・')}</div>`:''}
    </div>`).join('');
  document.getElementById('cartModalBody').innerHTML = `
    <div class="modal-head"><h3 style="margin:0;">我的訂單</h3><button class="close-x" id="cartClose">✕</button></div>
    <div style="margin-top:14px;">${linesHtml}</div>
    ${cart.length>0?`<div class="cart-total-row"><span>總計</span><span class="amount">$${total}</span></div>`:''}
    <button class="btn btn-primary" style="width:100%;margin-top:16px;" id="submitOrderBtn" ${cart.length===0?'disabled':''}>送出訂單</button>
  `;
  document.getElementById('cartOverlay').classList.add('active');
  document.getElementById('cartClose').onclick = () => document.getElementById('cartOverlay').classList.remove('active');
  document.querySelectorAll('#cartModalBody .remove').forEach(btn=>{
    btn.onclick = () => { cart.splice(+btn.dataset.idx,1); updateCartBar(); renderCartModal(); };
  });
  const submitBtn = document.getElementById('submitOrderBtn');
  if(submitBtn) submitBtn.onclick = submitOrder;
}
document.getElementById('cartOverlay').addEventListener('click', e=>{ if(e.target.id==='cartOverlay') document.getElementById('cartOverlay').classList.remove('active'); });

async function submitOrder(){
  const name = document.getElementById('customerName').value.trim();
  if(!name){
    showToast('請先輸入姓名或桌號');
    document.getElementById('cartOverlay').classList.remove('active');
    document.getElementById('customerName').focus();
    return;
  }
  const res = await fetch('/api/orders', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ customerName: name, items: cart })
  });
  if(!res.ok){ showToast('送出失敗，請再試一次'); return; }
  const order = await res.json();
  cart = [];
  updateCartBar();
  document.getElementById('cartOverlay').classList.remove('active');
  document.getElementById('cartModalBody').innerHTML = `
    <div style="text-align:center; padding:20px 0;">
      <div style="font-size:48px;">✅</div>
      <h3 style="margin:14px 0 6px;">訂單已送出！</h3>
      <p style="color:var(--ink-soft); font-size:14px;">您的取餐號碼</p>
      <div style="font-size:40px; font-weight:900; color:var(--chili); margin:6px 0 16px;">No. ${String(order.num).padStart(2,'0')}</div>
      <p style="color:var(--ink-soft); font-size:13px;">請至櫃檯以「${order.customerName}」取餐並付款・應付 $${order.total}</p>
      <button class="btn btn-primary" style="width:100%;margin-top:16px;" id="okBtn">好的</button>
    </div>
  `;
  document.getElementById('cartOverlay').classList.add('active');
  document.getElementById('okBtn').onclick = () => document.getElementById('cartOverlay').classList.remove('active');
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

loadMenu();
</script>
</body>
</html>
