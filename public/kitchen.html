<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>出餐看板・荷香早餐店</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
  .wrap{ padding:20px 24px 60px; }
  .head-row{ display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:12px; }
  .head-row h1{ font-size:24px; margin:0; font-weight:900; }
  .head-row .sub{ color:var(--ink-soft); font-size:14px; margin-top:2px; }
  .today-total{
    background:var(--ink); color:var(--paper); padding:14px 22px; border-radius:14px; text-align:right;
  }
  .today-total .label{ font-size:12px; opacity:.7; }
  .today-total .amount{ font-size:26px; font-weight:900; color:var(--yolk); }

  .ticket-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(310px,1fr)); gap:22px; }
  .ticket{ background:var(--white); border-radius:16px; box-shadow:var(--shadow); overflow:hidden; animation:pop .25s ease; }
  @keyframes pop{ from{opacity:0; transform:scale(.95);} to{opacity:1; transform:scale(1);} }
  .ticket-top{ background:var(--ink); color:var(--paper); padding:16px 18px; display:flex; justify-content:space-between; align-items:center; }
  .ticket-top .num{ font-size:28px; font-weight:900; color:var(--yolk); }
  .ticket-top .cust{ font-size:18px; font-weight:700; }
  .ticket-top .time{ font-size:13px; opacity:.75; }
  .type-badge{
    display:inline-block; font-size:15px; font-weight:900; padding:5px 14px; border-radius:100px;
    margin-top:6px;
  }
  .type-badge.dine-in{ background:#B8E0A0; color:#2C4A1E; }
  .type-badge.takeout{ background:var(--yolk); color:var(--ink); }
  .ready-badge{
    display:inline-block; font-size:13px; font-weight:900; padding:4px 12px; border-radius:100px;
    margin-top:6px; margin-left:6px; background:rgba(79,111,63,0.7); color:var(--white);
  }
  .ticket.is-ready{ box-shadow:0 0 0 3px var(--scallion), var(--shadow); }
  .ready-btn{ background:var(--yolk); color:var(--ink); }
  .phone-link{
    display:inline-flex; align-items:center; gap:6px; margin-top:8px; background:var(--scallion);
    color:var(--white); text-decoration:none; font-weight:900; font-size:15px; padding:6px 14px; border-radius:100px;
  }
  .note-line{
    background:rgba(240,165,0,0.15); border-left:4px solid var(--yolk); border-radius:6px;
    padding:8px 10px; margin-bottom:14px; font-size:14px; font-weight:700; color:#8A5A00;
  }
  .perforation{
    height:14px; background-color:var(--ink);
    background-image:
      radial-gradient(circle 7px at 0 7px, var(--paper) 99%, transparent 100%),
      radial-gradient(circle 7px at 100% 7px, var(--paper) 99%, transparent 100%),
      repeating-linear-gradient(to right, transparent 0 10px, var(--paper-deep) 10px 12px);
  }
  .ticket-body{ padding:18px; }
  .tline{ margin-bottom:14px; }
  .tline:last-child{ margin-bottom:0; }
  .tline .iname{ font-weight:900; font-size:20px; }
  .tline .iqty{ color:var(--ink-soft); font-weight:700; font-size:16px; }
  .tline .iprice{ color:var(--chili); font-weight:700; font-size:15px; float:right; }
  .tline .opts{ color:var(--chili); font-weight:700; font-size:16px; margin-top:2px; }
  .tline{ position:relative; padding-right:70px; }
  .tline-actions{ position:absolute; right:0; top:-2px; display:flex; gap:6px; }
  .tline-actions button{
    border:none; border-radius:8px; font-family:inherit; font-weight:900; cursor:pointer;
    width:30px; height:30px; font-size:14px;
  }
  .tline-swap{ background:var(--yolk); color:var(--ink); }
  .tline-remove{ background:var(--chili); color:var(--white); }
  .add-item-to-order-btn{ width:100%; margin-top:14px; font-size:14px; padding:10px; }
  .ticket-total{ border-top:2px dashed var(--paper-deep); margin-top:16px; padding-top:14px; display:flex; justify-content:space-between; align-items:center; }
  .ticket-total .label{ font-size:14px; color:var(--ink-soft); font-weight:700; }
  .ticket-total .amount{ font-size:28px; font-weight:900; color:var(--chili); }
  .ticket-actions{ display:flex; gap:8px; margin-top:16px; }
  .ticket-actions button{ flex:1; }
  .done-btn{ width:100%; font-size:17px; padding:16px; }
  .cancel-btn{ background:transparent; color:var(--ink-soft); border:2px solid var(--paper-deep); flex:none !important; width:48px; padding:16px 0; font-size:16px; }

  .kitchen-empty{ text-align:center; padding:80px 20px; color:var(--ink-soft); }
  .kitchen-empty .big{ font-size:48px; margin-bottom:10px; }

  .qr-hint{
    background:var(--white); border-radius:14px; padding:16px; margin-bottom:20px;
    display:flex; align-items:center; gap:12px; box-shadow:var(--shadow); font-size:14px; color:var(--ink-soft);
  }

  .end-day-btn{
    background:transparent; color:var(--paper); border:2px solid rgba(255,255,255,0.25);
    font-size:13px; padding:8px 14px; border-radius:100px; font-weight:700; cursor:pointer; font-family:inherit;
  }
  .end-day-btn:hover{ background:rgba(255,255,255,0.1); }

  .sound-hint{
    background:rgba(255,255,255,0.1); color:var(--paper); border-radius:100px; padding:6px 14px;
    font-size:12px; font-weight:700; display:flex; align-items:center; gap:6px;
  }
  .sound-hint .dot{ width:8px; height:8px; border-radius:100px; background:#5CBA6A; }
  .sound-hint.off .dot{ background:#C23616; }

  .ticket.warn{ box-shadow:0 0 0 3px var(--yolk), var(--shadow); }
  .ticket.urgent{ box-shadow:0 0 0 3px var(--chili), var(--shadow); animation:urgentPulse 1.2s infinite; }
  @keyframes urgentPulse{ 0%,100%{ box-shadow:0 0 0 3px var(--chili), var(--shadow); } 50%{ box-shadow:0 0 0 3px var(--chili), 0 0 0 8px rgba(194,54,22,0.25); } }
  .ticket-top .elapsed{ font-size:12px; opacity:.85; margin-top:2px; }
  .ticket.warn .ticket-top .elapsed{ color:var(--yolk); }
  .ticket.urgent .ticket-top .elapsed{ color:#ffb3a3; font-weight:900; }

  .recent-box{
    background:var(--white); border-radius:14px; padding:14px 18px; margin-bottom:20px; box-shadow:var(--shadow);
  }
  .recent-box h2{ font-size:14px; font-weight:900; margin:0 0 10px; color:var(--ink-soft); }
  .recent-list{ display:flex; gap:10px; overflow-x:auto; padding-bottom:2px; }
  .recent-item{
    background:var(--paper); border-radius:10px; padding:10px 14px; display:flex; align-items:center; gap:10px;
    white-space:nowrap; flex:none;
  }
  .recent-item .rtext{ font-size:13px; font-weight:700; }
  .recent-item .rtext .rnum{ color:var(--scallion-deep); }
  .recent-item button{ padding:7px 12px; font-size:12px; border-radius:8px; }

  .soldout-btn{
    background:transparent; color:var(--paper); border:2px solid rgba(255,255,255,0.25);
    font-size:13px; padding:8px 14px; border-radius:100px; font-weight:700; cursor:pointer; font-family:inherit;
  }
  .soldout-btn:hover{ background:rgba(255,255,255,0.1); }
  .soldout-search{
    width:100%; padding:10px 12px; border:2px solid var(--paper-deep); border-radius:8px;
    font-family:inherit; font-size:14px; margin-bottom:14px;
  }
  .soldout-row{
    display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--paper-deep);
  }
  .soldout-row:last-child{ border-bottom:none; }
  .soldout-row .sname{ flex:1; font-weight:700; font-size:14px; }
  .soldout-row .sname .scat{ color:var(--ink-soft); font-weight:500; font-size:12px; margin-left:6px; }
  .soldout-row .sprice{ color:var(--chili); font-weight:700; font-size:13px; }
  .soldout-row .stoggle{ padding:8px 14px; font-size:12px; border-radius:8px; }
  .soldout-row .stoggle.is-off{ background:var(--chili); border-color:var(--chili); color:var(--white); }
  .soldout-row.inactive .sname{ color:var(--ink-soft); text-decoration:line-through; }
  .soldout-login input{ width:100%; padding:14px; font-size:22px; text-align:center; letter-spacing:6px;
    border:2px solid var(--paper-deep); border-radius:12px; margin:16px 0; font-family:inherit; }
  .empty-state{ text-align:center; padding:30px 10px; color:var(--ink-soft); font-size:13px; }

  .picker-cat-tabs{ display:flex; gap:8px; overflow-x:auto; padding-bottom:10px; margin-bottom:14px; border-bottom:2px dashed var(--paper-deep); }
  .picker-tab{
    flex:none; border:2px solid var(--paper-deep); background:var(--white); color:var(--ink); font-family:inherit;
    font-weight:700; padding:9px 16px; border-radius:100px; cursor:pointer; font-size:14px; white-space:nowrap;
  }
  .picker-tab.active{ background:var(--scallion); border-color:var(--scallion); color:var(--white); }
  .picker-grid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; max-height:48vh; overflow-y:auto; padding-bottom:4px; }
  .picker-card{
    background:var(--white); border-radius:12px; box-shadow:var(--shadow); padding:12px 8px;
    text-align:center; cursor:pointer; border:2px solid transparent;
  }
  .picker-card:active{ border-color:var(--yolk); }
  .picker-card .pemoji{ font-size:24px; display:block; margin-bottom:4px; }
  .picker-card .pname{ font-weight:700; font-size:13px; line-height:1.25; }
  .picker-card .pprice{ color:var(--chili); font-weight:900; font-size:12px; margin-top:4px; }
</style>
</head>
<body>
<div class="topbar">
  <div><h1>👵 出餐看板</h1><div class="sub">依點餐順序排列・完成請按「完成並收款」</div></div>
  <div style="display:flex; align-items:center; gap:8px;">
    <span class="sound-hint" id="connHint"><span class="dot"></span>連線正常</span>
    <span class="sound-hint off" id="soundHint"><span class="dot"></span>提示音準備中</span>
    <button class="soldout-btn" id="soldOutBtn">🚫 標記賣完</button>
    <button class="end-day-btn" id="endDayBtn">🔚 結束今日營業</button>
    <a href="/qrcode.html" style="color:var(--paper); text-decoration:none; font-size:13px; background:rgba(255,255,255,0.12); padding:8px 14px; border-radius:100px;">📱 QR Code</a>
    <a href="/dashboard.html" style="color:var(--paper); text-decoration:none; font-size:13px; background:rgba(255,255,255,0.12); padding:8px 14px; border-radius:100px;">📊 營業儀表板</a>
    <a href="/admin.html" style="color:var(--paper); text-decoration:none; font-size:13px; background:rgba(255,255,255,0.12); padding:8px 14px; border-radius:100px;">🍳 菜單管理</a>
  </div>
</div>
<div class="wrap">
  <div class="head-row">
    <div class="qr-hint" style="flex:1;">📱 顧客請掃店內 QR Code 至 <b>/customer.html</b> 點餐</div>
    <div class="today-total">
      <div class="label">今日已收</div>
      <div class="amount" id="todayTotal">$0</div>
    </div>
  </div>
  <div class="recent-box" id="recentBox" style="display:none;">
    <h2>🕐 最近完成（按錯可以復原）</h2>
    <div class="recent-list" id="recentList"></div>
  </div>
  <div class="ticket-grid" id="ticketGrid"></div>
</div>
<div class="overlay" id="soldOutOverlay"><div class="modal" id="soldOutModalBody"></div></div>
<div class="overlay" id="swapOverlay"><div class="modal" id="swapModalBody"></div></div>
<div class="toast" id="toast"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
let orders = [];
let recentlyCompleted = []; // 最近完成的訂單，供「復原」使用
const RECENT_LIMIT = 8;
const socket = io();
let hasConnectedBefore = false;

socket.on('connect', () => {
  const hint = document.getElementById('connHint');
  hint.classList.remove('off');
  hint.innerHTML = '<span class="dot"></span>連線正常';
  if(hasConnectedBefore){
    // 斷線後重新連上，補抓斷線期間可能漏掉的訂單狀態
    showToast('連線已恢復，重新同步訂單中…');
    loadOrders();
    loadSummary();
  }
  hasConnectedBefore = true;
});
socket.on('disconnect', () => {
  const hint = document.getElementById('connHint');
  hint.classList.add('off');
  hint.innerHTML = '<span class="dot"></span>連線中斷，重新連線中…';
});

// ---------------- 提示音（第一次點畫面任何地方就自動啟用，不用特地按按鈕） ----------------
let audioCtx = null;
let soundEnabled = false;

function markSoundReady(){
  soundEnabled = true;
  const hint = document.getElementById('soundHint');
  hint.classList.remove('off');
  hint.innerHTML = '<span class="dot"></span>提示音已開啟';
}

function unlockAudioOnce(){
  if(!audioCtx){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if(audioCtx.state === 'suspended'){
    audioCtx.resume().then(markSoundReady).catch(()=>{});
  } else {
    markSoundReady();
  }
}
document.addEventListener('click', unlockAudioOnce, { once: true });
document.addEventListener('touchstart', unlockAudioOnce, { once: true });

function playChime(){
  if(!soundEnabled || !audioCtx) return;
  const now = audioCtx.currentTime;
  [880, 1175].forEach((freq, i) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, now + i * 0.18);
    gain.gain.linearRampToValueAtTime(0.35, now + i * 0.18 + 0.03);
    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.18 + 0.35);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now + i * 0.18);
    osc.stop(now + i * 0.18 + 0.4);
  });
}

// ---------------- 訂單資料 ----------------
async function loadOrders(){
  const res = await fetch('/api/orders');
  orders = (await res.json()).filter(o => o.status === 'pending' || o.status === 'ready');
  renderTickets();
}
async function loadSummary(){
  const res = await fetch('/api/orders/summary');
  const data = await res.json();
  document.getElementById('todayTotal').textContent = '$' + data.total;
}

const WARN_MIN = 8;   // 超過這個分鐘數，邊框變黃色提醒
const URGENT_MIN = 15; // 超過這個分鐘數，邊框變紅色閃爍

function renderTickets(){
  const grid = document.getElementById('ticketGrid');
  if(orders.length === 0){
    grid.innerHTML = `<div class="kitchen-empty" style="grid-column:1/-1;"><div class="big">☕</div>目前沒有訂單，等待點餐中…</div>`;
    return;
  }
  grid.innerHTML = '';
  orders.forEach(o => {
    const lines = o.items.map((it, idx) => `
      <div class="tline">
        <span class="iprice">$${it.unitPrice}</span>
        <span class="iname">${it.emoji||''} ${it.name}</span>
        <span class="iqty"> x${it.qty}</span>
        <div class="tline-actions">
          <button class="tline-swap" data-swap-order="${o.id}" data-swap-idx="${idx}" title="換成別的品項">🔄</button>
          <button class="tline-remove" data-remove-order="${o.id}" data-remove-idx="${idx}" title="賣完了，移除這項">✕</button>
        </div>
        ${it.opts && it.opts.length ? `<div class="opts">${it.opts.join('・')}</div>` : ''}
        ${it.note ? `<div class="note-line" style="margin:6px 0 0;">📝 ${it.note}</div>` : ''}
      </div>`).join('');
    const created = new Date(o.createdAt);
    const time = created.toLocaleTimeString('zh-TW', {hour:'2-digit', minute:'2-digit'});
    const elapsedMin = Math.floor((Date.now() - created.getTime()) / 60000);
    const isReady = o.status === 'ready';
    let stateClass = '';
    if(isReady) stateClass = 'is-ready';
    else if(elapsedMin >= URGENT_MIN) stateClass = 'urgent';
    else if(elapsedMin >= WARN_MIN) stateClass = 'warn';
    const ticket = document.createElement('div');
    ticket.className = 'ticket' + (stateClass ? ' ' + stateClass : '');
    const actionsHtml = isReady
      ? `<button class="btn btn-green done-btn" data-id="${o.id}">✓ 完成並收款 $${o.total}</button>`
      : (o.orderType === 'takeout'
          ? `<button class="btn ready-btn" data-ready="${o.id}">🔔 通知取餐</button>
             <button class="btn btn-green done-btn" data-id="${o.id}" title="客人已在現場，直接完成">✓ 完成並收款</button>`
          : `<button class="btn btn-green done-btn" data-id="${o.id}">✓ 完成並收款 $${o.total}</button>`);
    ticket.innerHTML = `
      <div class="ticket-top">
        <div>
          <div class="num">No.${String(o.num).padStart(2,'0')}</div>
          <div class="cust">${o.customerName}</div>
          <span class="type-badge ${o.orderType==='takeout'?'takeout':'dine-in'}">${o.orderType==='takeout'?'🥡 外帶':'🍽️ 內用'}</span>
          ${isReady ? '<span class="ready-badge">🔔 已通知取餐</span>' : ''}
          ${o.customerPhone ? `<div><a class="phone-link" href="tel:${o.customerPhone}">📞 ${o.customerPhone}</a></div>` : ''}
        </div>
        <div style="text-align:right;">
          <span class="time">${time}</span>
          <div class="elapsed">已等 ${elapsedMin} 分鐘</div>
        </div>
      </div>
      <div class="perforation"></div>
      <div class="ticket-body">
        ${lines}
        <button class="btn btn-outline add-item-to-order-btn" data-addto="${o.id}">➕ 加點</button>
        <div class="ticket-total"><span class="label">應收金額</span><span class="amount">$${o.total}</span></div>
        <div class="ticket-actions">
          ${actionsHtml}
          <button class="btn cancel-btn" data-cancel="${o.id}" title="取消訂單">✕</button>
        </div>
      </div>
    `;
    grid.appendChild(ticket);
  });
  grid.querySelectorAll('.done-btn').forEach(btn => {
    btn.onclick = async () => {
      const id = btn.dataset.id;
      await fetch(`/api/orders/${id}/paid`, { method:'POST' });
    };
  });
  grid.querySelectorAll('[data-ready]').forEach(btn => {
    btn.onclick = async () => {
      await fetch(`/api/orders/${btn.dataset.ready}/ready`, { method:'POST' });
    };
  });
  grid.querySelectorAll('[data-cancel]').forEach(btn => {
    btn.onclick = async () => {
      if(!confirm('確定要取消這張訂單嗎？')) return;
      await fetch(`/api/orders/${btn.dataset.cancel}/cancel`, { method:'POST' });
    };
  });
  grid.querySelectorAll('[data-remove-order]').forEach(btn => {
    btn.onclick = () => removeItemFromOrder(btn.dataset.removeOrder, Number(btn.dataset.removeIdx));
  });
  grid.querySelectorAll('[data-swap-order]').forEach(btn => {
    btn.onclick = () => openSwapPanel(btn.dataset.swapOrder, Number(btn.dataset.swapIdx));
  });
  grid.querySelectorAll('[data-addto]').forEach(btn => {
    btn.onclick = () => openAddItemPanel(btn.dataset.addto);
  });
}

// 把訂單目前的品項送去更新（同時用來處理「移除」跟「換品項」）
async function updateOrderItems(orderId, newItems){
  const order = orders.find(o => o.id === orderId);
  if(!order) return;
  const res = await fetch(`/api/orders/${orderId}`, {
    method:'PUT', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      items: newItems,
      customerName: order.customerName,
      customerPhone: order.customerPhone,
      note: order.note,
      orderType: order.orderType,
    })
  });
  if(!res.ok){
    const err = await res.json().catch(()=>({}));
    showToast(err.error || '更新失敗');
    return false;
  }
  const updated = await res.json();
  const idx = orders.findIndex(o => o.id === orderId);
  if(idx > -1) orders[idx] = updated;
  renderTickets();
  return true;
}

function removeItemFromOrder(orderId, itemIdx){
  const order = orders.find(o => o.id === orderId);
  if(!order) return;
  const item = order.items[itemIdx];
  if(order.items.length === 1){
    showToast('這是最後一項了，如果整單不做了請直接取消訂單');
    return;
  }
  if(!confirm(`確定「${item.name}」賣完了嗎？會直接從這張訂單移除，金額也會扣掉。`)) return;
  const newItems = order.items.filter((_, i) => i !== itemIdx);
  updateOrderItems(orderId, newItems).then(ok => {
    if(ok) showToast(`已移除「${item.name}」，金額已更新`);
  });
}

async function openSwapPanel(orderId, itemIdx){
  const order = orders.find(o => o.id === orderId);
  if(!order) return;
  const oldItem = order.items[itemIdx];
  openItemPicker({
    title: '換成別的品項',
    sub: `原本是「${oldItem.name}」x${oldItem.qty}，選一個要換成的品項（數量會維持 x${oldItem.qty}，不含原本的客製化選項）`,
    pickLabel: '換成這個',
    onPick: async (picked) => {
      const newItem = { name: picked.name, emoji: picked.emoji, qty: oldItem.qty, unitPrice: picked.price, opts: [] };
      const newItems = order.items.map((it, i) => i === itemIdx ? newItem : it);
      const ok = await updateOrderItems(orderId, newItems);
      if(ok){
        document.getElementById('swapOverlay').classList.remove('active');
        showToast(`已把「${oldItem.name}」換成「${picked.name}」`);
      }
    }
  });
}
document.getElementById('swapOverlay').addEventListener('click', e => {
  if(e.target.id === 'swapOverlay') document.getElementById('swapOverlay').classList.remove('active');
});

async function openAddItemPanel(orderId){
  const order = orders.find(o => o.id === orderId);
  if(!order) return;
  openItemPicker({
    title: '幫客人加點',
    sub: `選一個要幫 No.${String(order.num).padStart(2,'0')}・${order.customerName} 加進去的品項（不含客製化選項，數量預設 x1）`,
    pickLabel: '加這個',
    onPick: async (picked) => {
      const newItem = { name: picked.name, emoji: picked.emoji, qty: 1, unitPrice: picked.price, opts: [] };
      const newItems = [...order.items, newItem];
      const ok = await updateOrderItems(orderId, newItems);
      if(ok){
        document.getElementById('swapOverlay').classList.remove('active');
        showToast(`已幫 No.${String(order.num).padStart(2,'0')} 加點「${picked.name}」`);
      }
    }
  });
}

// 共用的「分類頁籤＋方格」選品項介面，換品項／加點都用這個
let pickerActiveCat = '';
async function openItemPicker({ title, sub, pickLabel, onPick }){
  document.getElementById('swapOverlay').classList.add('active');
  const modal = document.getElementById('swapModalBody');
  modal.innerHTML = `<div class="modal-head"><h3 style="margin:0;">${title}</h3><button class="close-x" id="swapClose">✕</button></div>
    <div class="hint" style="margin:8px 0 12px;">${sub}</div>
    <div id="pickerCatTabs" class="picker-cat-tabs"></div>
    <div id="pickerGrid" class="picker-grid"><div class="empty-state">載入中…</div></div>`;
  document.getElementById('swapClose').onclick = () => document.getElementById('swapOverlay').classList.remove('active');

  const res = await fetch('/api/menu');
  const menu = await res.json();
  const categories = [...new Set(menu.map(m => m.category))];
  if(!pickerActiveCat || !categories.includes(pickerActiveCat)) pickerActiveCat = categories[0] || '';

  function renderTabs(){
    document.getElementById('pickerCatTabs').innerHTML = categories.map(c =>
      `<button class="picker-tab ${c===pickerActiveCat?'active':''}" data-cat="${c}">${c}</button>`
    ).join('');
    document.querySelectorAll('.picker-tab').forEach(btn => {
      btn.onclick = () => { pickerActiveCat = btn.dataset.cat; renderTabs(); renderGrid(); };
    });
  }

  function renderGrid(){
    const items = menu.filter(m => m.category === pickerActiveCat);
    const gridEl = document.getElementById('pickerGrid');
    if(items.length === 0){
      gridEl.innerHTML = '<div class="empty-state">這個分類沒有品項</div>';
      return;
    }
    gridEl.innerHTML = items.map(m => `
      <div class="picker-card" data-pick="${m.id}">
        <span class="pemoji">${m.emoji||'🍽️'}</span>
        <div class="pname">${m.name}</div>
        <div class="pprice">$${m.price}</div>
      </div>
    `).join('');
    gridEl.querySelectorAll('[data-pick]').forEach(card => {
      card.onclick = () => {
        const picked = menu.find(m => m.id === card.dataset.pick);
        onPick(picked);
      };
    });
  }

  renderTabs();
  renderGrid();
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

function renderRecent(){
  const box = document.getElementById('recentBox');
  const list = document.getElementById('recentList');
  if(recentlyCompleted.length === 0){
    box.style.display = 'none';
    return;
  }
  box.style.display = 'block';
  list.innerHTML = recentlyCompleted.map(o => `
    <div class="recent-item">
      <span class="rtext"><span class="rnum">No.${String(o.num).padStart(2,'0')}</span> ${o.customerName}・$${o.total}</span>
      <button class="btn btn-outline" data-undo="${o.id}">復原</button>
    </div>
  `).join('');
  list.querySelectorAll('[data-undo]').forEach(btn => {
    btn.onclick = async () => {
      await fetch(`/api/orders/${btn.dataset.undo}/undo`, { method:'POST' });
    };
  });
}

socket.on('new_order', (order) => {
  orders.push(order);
  renderTickets();
  playChime();
  showToast(`新訂單 No.${String(order.num).padStart(2,'0')}・${order.customerName}`);
});
socket.on('order_ready', (order) => {
  const idx = orders.findIndex(o => o.id === order.id);
  if(idx > -1) orders[idx] = order;
  renderTickets();
});
socket.on('order_paid', ({ order, summary }) => {
  orders = orders.filter(o => o.id !== order.id);
  renderTickets();
  document.getElementById('todayTotal').textContent = '$' + summary.total;
  recentlyCompleted.unshift(order);
  recentlyCompleted = recentlyCompleted.slice(0, RECENT_LIMIT);
  renderRecent();
});
socket.on('order_undone', ({ order, summary }) => {
  recentlyCompleted = recentlyCompleted.filter(o => o.id !== order.id);
  renderRecent();
  orders.push(order);
  renderTickets();
  document.getElementById('todayTotal').textContent = '$' + summary.total;
  showToast(`已復原 No.${String(order.num).padStart(2,'0')}`);
});
socket.on('order_cancelled', (order) => {
  orders = orders.filter(o => o.id !== order.id);
  renderTickets();
});
socket.on('order_updated', (order) => {
  const idx = orders.findIndex(o => o.id === order.id);
  if(idx > -1){
    orders[idx] = order;
  } else {
    orders.push(order);
  }
  renderTickets();
  showToast(`訂單 No.${String(order.num).padStart(2,'0')} 內容有更新`);
});

// 每 30 秒重畫一次，讓「已等 X 分鐘」跟顏色提醒會持續更新
setInterval(renderTickets, 30000);

document.getElementById('endDayBtn').onclick = async () => {
  let msg = '確定要結束今日營業嗎？\n\n這會做兩件事：\n1. 叫號重設回 No.01，明天從 1 重新開始編號\n2. 今天標記「賣完」的品項會全部自動恢復上架\n\n今天已經完成的訂單、營業額紀錄都不會受影響。';
  if(orders.length > 0){
    msg = `⚠️ 目前還有 ${orders.length} 筆訂單尚未完成！\n\n` + msg;
  }
  if(!confirm(msg)) return;
  const res = await fetch('/api/admin/reset-counter', { method:'POST' });
  const data = await res.json();
  showToast(data.restoredCount > 0
    ? `已重設叫號，並恢復 ${data.restoredCount} 項賣完的品項上架`
    : '已重設，明天從 No.01 開始');
};

// ---------------- 標記賣完 ----------------
let soldOutPin = sessionStorage.getItem('admin_pin') || '';

document.getElementById('soldOutBtn').onclick = openSoldOutPanel;

function openSoldOutPanel(){
  document.getElementById('soldOutOverlay').classList.add('active');
  if(soldOutPin){
    renderSoldOutList();
  } else {
    renderSoldOutLogin();
  }
}
document.getElementById('soldOutOverlay').addEventListener('click', e => {
  if(e.target.id === 'soldOutOverlay') document.getElementById('soldOutOverlay').classList.remove('active');
});

function renderSoldOutLogin(errorMsg){
  const modal = document.getElementById('soldOutModalBody');
  modal.innerHTML = `
    <div class="modal-head"><h3 style="margin:0;">🚫 標記賣完</h3><button class="close-x" id="soldOutClose">✕</button></div>
    <div class="soldout-login">
      <p style="color:var(--ink-soft); font-size:13px; margin-top:14px;">請輸入管理密碼（跟菜單管理同一組）</p>
      <input id="soldOutPinInput" type="password" inputmode="numeric" maxlength="6" placeholder="****">
      <button class="btn btn-primary" style="width:100%;" id="soldOutLoginBtn">確認</button>
      ${errorMsg ? `<p style="color:var(--chili); font-size:13px; margin-top:10px;">${errorMsg}</p>` : ''}
    </div>
  `;
  document.getElementById('soldOutClose').onclick = () => document.getElementById('soldOutOverlay').classList.remove('active');
  const doLogin = async () => {
    const pin = document.getElementById('soldOutPinInput').value.trim();
    const res = await fetch('/api/admin/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({pin}) });
    if(res.ok){
      soldOutPin = pin;
      sessionStorage.setItem('admin_pin', pin);
      renderSoldOutList();
    } else {
      renderSoldOutLogin('密碼錯誤，請再試一次');
    }
  };
  document.getElementById('soldOutLoginBtn').onclick = doLogin;
  document.getElementById('soldOutPinInput').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
}

async function renderSoldOutList(searchTerm){
  const modal = document.getElementById('soldOutModalBody');
  const res = await fetch('/api/menu?all=1');
  if(!res.ok){ renderSoldOutLogin(); return; }
  const menu = await res.json();
  const term = (searchTerm || '').trim();
  const filtered = term ? menu.filter(m => m.name.includes(term) || m.category.includes(term)) : menu;

  modal.innerHTML = `
    <div class="modal-head"><h3 style="margin:0;">🚫 標記賣完</h3><button class="close-x" id="soldOutClose">✕</button></div>
    <input class="soldout-search" id="soldOutSearch" placeholder="搜尋品項名稱或分類…" value="${term}">
    <div id="soldOutList" style="max-height:50vh; overflow-y:auto;"></div>
  `;
  document.getElementById('soldOutClose').onclick = () => document.getElementById('soldOutOverlay').classList.remove('active');
  const searchInput = document.getElementById('soldOutSearch');
  searchInput.oninput = () => renderSoldOutList(searchInput.value);
  searchInput.focus();
  searchInput.setSelectionRange(term.length, term.length);

  const list = document.getElementById('soldOutList');
  if(filtered.length === 0){
    list.innerHTML = '<div class="empty-state">找不到符合的品項</div>';
    return;
  }
  list.innerHTML = filtered.map(m => {
    const isActive = m.active !== false;
    return `
      <div class="soldout-row ${isActive?'':'inactive'}">
        <span class="sname">${m.emoji||''} ${m.name}<span class="scat">${m.category}</span></span>
        <span class="sprice">$${m.price}</span>
        <button class="btn btn-outline stoggle ${isActive?'':'is-off'}" data-toggle-id="${m.id}" data-active="${isActive}">${isActive?'標記賣完':'恢復上架'}</button>
      </div>
    `;
  }).join('');
  list.querySelectorAll('[data-toggle-id]').forEach(btn => {
    btn.onclick = async () => {
      const id = btn.dataset.toggleId;
      const currentlyActive = btn.dataset.active === 'true';
      const res2 = await fetch(`/api/admin/menu/${id}`, {
        method:'PUT', headers:{'Content-Type':'application/json','x-admin-pin':soldOutPin},
        body: JSON.stringify({ active: !currentlyActive })
      });
      if(res2.status === 401){
        soldOutPin = '';
        sessionStorage.removeItem('admin_pin');
        renderSoldOutLogin('密碼已失效，請重新輸入');
        return;
      }
      showToast(currentlyActive ? '已標記賣完，顧客點餐頁不會再顯示這項' : '已恢復上架');
      renderSoldOutList(searchInput.value);
    };
  });
}

loadSummary();
