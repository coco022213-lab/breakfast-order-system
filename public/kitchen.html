<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>出餐看板・荷香早餐店</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
  .wrap{ padding:20px 24px 60px; }
  .head-row{ display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:12px; }
  .head-row h1{ font-size:24px; margin:0; font-weight:900; }
  .head-row .sub{ color:var(--ink-soft); font-size:14px; margin-top:2px; }
  .today-total{
    background:var(--ink); color:var(--paper); padding:14px 22px; border-radius:14px; text-align:right;
  }
  .today-total .label{ font-size:12px; opacity:.7; }
  .today-total .amount{ font-size:26px; font-weight:900; color:var(--yolk); }

  .ticket-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(310px,1fr)); gap:22px; }
  .ticket{ background:var(--white); border-radius:16px; box-shadow:var(--shadow); overflow:hidden; animation:pop .25s ease; }
  @keyframes pop{ from{opacity:0; transform:scale(.95);} to{opacity:1; transform:scale(1);} }
  .ticket-top{ background:var(--ink); color:var(--paper); padding:16px 18px; display:flex; justify-content:space-between; align-items:center; }
  .ticket-top .num{ font-size:28px; font-weight:900; color:var(--yolk); }
  .ticket-top .cust{ font-size:18px; font-weight:700; }
  .ticket-top .time{ font-size:13px; opacity:.75; }
  .type-badge{
    display:inline-block; font-size:15px; font-weight:900; padding:5px 14px; border-radius:100px;
    margin-top:6px;
  }
  .type-badge.dine-in{ background:#B8E0A0; color:#2C4A1E; }
  .type-badge.takeout{ background:var(--yolk); color:var(--ink); }
  .perforation{
    height:14px; background-color:var(--ink);
    background-image:
      radial-gradient(circle 7px at 0 7px, var(--paper) 99%, transparent 100%),
      radial-gradient(circle 7px at 100% 7px, var(--paper) 99%, transparent 100%),
      repeating-linear-gradient(to right, transparent 0 10px, var(--paper-deep) 10px 12px);
  }
  .ticket-body{ padding:18px; }
  .tline{ margin-bottom:14px; }
  .tline:last-child{ margin-bottom:0; }
  .tline .iname{ font-weight:900; font-size:20px; }
  .tline .iqty{ color:var(--ink-soft); font-weight:700; font-size:16px; }
  .tline .opts{ color:var(--chili); font-weight:700; font-size:16px; margin-top:2px; }
  .ticket-total{ border-top:2px dashed var(--paper-deep); margin-top:16px; padding-top:14px; display:flex; justify-content:space-between; align-items:center; }
  .ticket-total .label{ font-size:14px; color:var(--ink-soft); font-weight:700; }
  .ticket-total .amount{ font-size:28px; font-weight:900; color:var(--chili); }
  .ticket-actions{ display:flex; gap:8px; margin-top:16px; }
  .ticket-actions button{ flex:1; }
  .done-btn{ width:100%; font-size:17px; padding:16px; }
  .cancel-btn{ background:transparent; color:var(--ink-soft); border:2px solid var(--paper-deep); flex:none !important; width:48px; padding:16px 0; font-size:16px; }

  .kitchen-empty{ text-align:center; padding:80px 20px; color:var(--ink-soft); }
  .kitchen-empty .big{ font-size:48px; margin-bottom:10px; }

  .qr-hint{
    background:var(--white); border-radius:14px; padding:16px; margin-bottom:20px;
    display:flex; align-items:center; gap:12px; box-shadow:var(--shadow); font-size:14px; color:var(--ink-soft);
  }

  .end-day-btn{
    background:transparent; color:var(--paper); border:2px solid rgba(255,255,255,0.25);
    font-size:13px; padding:8px 14px; border-radius:100px; font-weight:700; cursor:pointer; font-family:inherit;
  }
  .end-day-btn:hover{ background:rgba(255,255,255,0.1); }

  .sound-hint{
    background:rgba(255,255,255,0.1); color:var(--paper); border-radius:100px; padding:6px 14px;
    font-size:12px; font-weight:700; display:flex; align-items:center; gap:6px;
  }
  .sound-hint .dot{ width:8px; height:8px; border-radius:100px; background:#5CBA6A; }
  .sound-hint.off .dot{ background:#C23616; }

  .ticket.warn{ box-shadow:0 0 0 3px var(--yolk), var(--shadow); }
  .ticket.urgent{ box-shadow:0 0 0 3px var(--chili), var(--shadow); animation:urgentPulse 1.2s infinite; }
  @keyframes urgentPulse{ 0%,100%{ box-shadow:0 0 0 3px var(--chili), var(--shadow); } 50%{ box-shadow:0 0 0 3px var(--chili), 0 0 0 8px rgba(194,54,22,0.25); } }
  .ticket-top .elapsed{ font-size:12px; opacity:.85; margin-top:2px; }
  .ticket.warn .ticket-top .elapsed{ color:var(--yolk); }
  .ticket.urgent .ticket-top .elapsed{ color:#ffb3a3; font-weight:900; }

  .recent-box{
    background:var(--white); border-radius:14px; padding:14px 18px; margin-bottom:20px; box-shadow:var(--shadow);
  }
  .recent-box h2{ font-size:14px; font-weight:900; margin:0 0 10px; color:var(--ink-soft); }
  .recent-list{ display:flex; gap:10px; overflow-x:auto; padding-bottom:2px; }
  .recent-item{
    background:var(--paper); border-radius:10px; padding:10px 14px; display:flex; align-items:center; gap:10px;
    white-space:nowrap; flex:none;
  }
  .recent-item .rtext{ font-size:13px; font-weight:700; }
  .recent-item .rtext .rnum{ color:var(--scallion-deep); }
  .recent-item button{ padding:7px 12px; font-size:12px; border-radius:8px; }
</style>
</head>
<body>
<div class="topbar">
  <div><h1>👵 出餐看板</h1><div class="sub">依點餐順序排列・完成請按「完成並收款」</div></div>
  <div style="display:flex; align-items:center; gap:8px;">
    <span class="sound-hint off" id="soundHint"><span class="dot"></span>提示音準備中</span>
    <button class="end-day-btn" id="endDayBtn">🔚 結束今日營業</button>
    <a href="/qrcode.html" style="color:var(--paper); text-decoration:none; font-size:13px; background:rgba(255,255,255,0.12); padding:8px 14px; border-radius:100px;">📱 QR Code</a>
    <a href="/dashboard.html" style="color:var(--paper); text-decoration:none; font-size:13px; background:rgba(255,255,255,0.12); padding:8px 14px; border-radius:100px;">📊 營業儀表板</a>
    <a href="/admin.html" style="color:var(--paper); text-decoration:none; font-size:13px; background:rgba(255,255,255,0.12); padding:8px 14px; border-radius:100px;">🍳 菜單管理</a>
  </div>
</div>
<div class="wrap">
  <div class="head-row">
    <div class="qr-hint" style="flex:1;">📱 顧客請掃店內 QR Code 至 <b>/customer.html</b> 點餐</div>
    <div class="today-total">
      <div class="label">今日已收</div>
      <div class="amount" id="todayTotal">$0</div>
    </div>
  </div>
  <div class="recent-box" id="recentBox" style="display:none;">
    <h2>🕐 最近完成（按錯可以復原）</h2>
    <div class="recent-list" id="recentList"></div>
  </div>
  <div class="ticket-grid" id="ticketGrid"></div>
</div>
<div class="toast" id="toast"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
let orders = [];
let recentlyCompleted = []; // 最近完成的訂單，供「復原」使用
const RECENT_LIMIT = 8;
const socket = io();

// ---------------- 提示音（第一次點畫面任何地方就自動啟用，不用特地按按鈕） ----------------
let audioCtx = null;
let soundEnabled = false;

function markSoundReady(){
  soundEnabled = true;
  const hint = document.getElementById('soundHint');
  hint.classList.remove('off');
  hint.innerHTML = '<span class="dot"></span>提示音已開啟';
}

function unlockAudioOnce(){
  if(!audioCtx){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if(audioCtx.state === 'suspended'){
    audioCtx.resume().then(markSoundReady).catch(()=>{});
  } else {
    markSoundReady();
  }
}
document.addEventListener('click', unlockAudioOnce, { once: true });
document.addEventListener('touchstart', unlockAudioOnce, { once: true });

function playChime(){
  if(!soundEnabled || !audioCtx) return;
  const now = audioCtx.currentTime;
  [880, 1175].forEach((freq, i) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, now + i * 0.18);
    gain.gain.linearRampToValueAtTime(0.35, now + i * 0.18 + 0.03);
    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.18 + 0.35);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now + i * 0.18);
    osc.stop(now + i * 0.18 + 0.4);
  });
}

// ---------------- 訂單資料 ----------------
async function loadOrders(){
  const res = await fetch('/api/orders');
  orders = (await res.json()).filter(o => o.status === 'pending');
  renderTickets();
}
async function loadSummary(){
  const res = await fetch('/api/orders/summary');
  const data = await res.json();
  document.getElementById('todayTotal').textContent = '$' + data.total;
}

const WARN_MIN = 8;   // 超過這個分鐘數，邊框變黃色提醒
const URGENT_MIN = 15; // 超過這個分鐘數，邊框變紅色閃爍

function renderTickets(){
  const grid = document.getElementById('ticketGrid');
  if(orders.length === 0){
    grid.innerHTML = `<div class="kitchen-empty" style="grid-column:1/-1;"><div class="big">☕</div>目前沒有訂單，等待點餐中…</div>`;
    return;
  }
  grid.innerHTML = '';
  orders.forEach(o => {
    const lines = o.items.map(it => `
      <div class="tline">
        <span class="iname">${it.emoji||''} ${it.name}</span>
        <span class="iqty"> x${it.qty}</span>
        ${it.opts && it.opts.length ? `<div class="opts">${it.opts.join('・')}</div>` : ''}
      </div>`).join('');
    const created = new Date(o.createdAt);
    const time = created.toLocaleTimeString('zh-TW', {hour:'2-digit', minute:'2-digit'});
    const elapsedMin = Math.floor((Date.now() - created.getTime()) / 60000);
    let stateClass = '';
    if(elapsedMin >= URGENT_MIN) stateClass = 'urgent';
    else if(elapsedMin >= WARN_MIN) stateClass = 'warn';
    const ticket = document.createElement('div');
    ticket.className = 'ticket' + (stateClass ? ' ' + stateClass : '');
    ticket.innerHTML = `
      <div class="ticket-top">
        <div>
          <div class="num">No.${String(o.num).padStart(2,'0')}</div>
          <div class="cust">${o.customerName}</div>
          <span class="type-badge ${o.orderType==='takeout'?'takeout':'dine-in'}">${o.orderType==='takeout'?'🥡 外帶':'🍽️ 內用'}</span>
        </div>
        <div style="text-align:right;">
          <span class="time">${time}</span>
          <div class="elapsed">已等 ${elapsedMin} 分鐘</div>
        </div>
      </div>
      <div class="perforation"></div>
      <div class="ticket-body">
        ${lines}
        <div class="ticket-total"><span class="label">應收金額</span><span class="amount">$${o.total}</span></div>
        <div class="ticket-actions">
          <button class="btn btn-green done-btn" data-id="${o.id}">✓ 完成並收款 $${o.total}</button>
          <button class="btn cancel-btn" data-cancel="${o.id}" title="取消訂單">✕</button>
        </div>
      </div>
    `;
    grid.appendChild(ticket);
  });
  grid.querySelectorAll('.done-btn').forEach(btn => {
    btn.onclick = async () => {
      const id = btn.dataset.id;
      await fetch(`/api/orders/${id}/paid`, { method:'POST' });
    };
  });
  grid.querySelectorAll('[data-cancel]').forEach(btn => {
    btn.onclick = async () => {
      if(!confirm('確定要取消這張訂單嗎？')) return;
      await fetch(`/api/orders/${btn.dataset.cancel}/cancel`, { method:'POST' });
    };
  });
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

function renderRecent(){
  const box = document.getElementById('recentBox');
  const list = document.getElementById('recentList');
  if(recentlyCompleted.length === 0){
    box.style.display = 'none';
    return;
  }
  box.style.display = 'block';
  list.innerHTML = recentlyCompleted.map(o => `
    <div class="recent-item">
      <span class="rtext"><span class="rnum">No.${String(o.num).padStart(2,'0')}</span> ${o.customerName}・$${o.total}</span>
      <button class="btn btn-outline" data-undo="${o.id}">復原</button>
    </div>
  `).join('');
  list.querySelectorAll('[data-undo]').forEach(btn => {
    btn.onclick = async () => {
      await fetch(`/api/orders/${btn.dataset.undo}/undo`, { method:'POST' });
    };
  });
}

socket.on('new_order', (order) => {
  orders.push(order);
  renderTickets();
  playChime();
  showToast(`新訂單 No.${String(order.num).padStart(2,'0')}・${order.customerName}`);
});
socket.on('order_paid', ({ order, summary }) => {
  orders = orders.filter(o => o.id !== order.id);
  renderTickets();
  document.getElementById('todayTotal').textContent = '$' + summary.total;
  recentlyCompleted.unshift(order);
  recentlyCompleted = recentlyCompleted.slice(0, RECENT_LIMIT);
  renderRecent();
});
socket.on('order_undone', ({ order, summary }) => {
  recentlyCompleted = recentlyCompleted.filter(o => o.id !== order.id);
  renderRecent();
  orders.push(order);
  renderTickets();
  document.getElementById('todayTotal').textContent = '$' + summary.total;
  showToast(`已復原 No.${String(order.num).padStart(2,'0')}`);
});
socket.on('order_cancelled', (order) => {
  orders = orders.filter(o => o.id !== order.id);
  renderTickets();
});

// 每 30 秒重畫一次，讓「已等 X 分鐘」跟顏色提醒會持續更新
setInterval(renderTickets, 30000);

document.getElementById('endDayBtn').onclick = async () => {
  let msg = '確定要結束今日營業嗎？\n\n這只會把叫號重設回 No.01，明天開始的訂單會從 1 重新編號。今天已經完成的訂單、營業額紀錄都不會受影響。';
  if(orders.length > 0){
    msg = `⚠️ 目前還有 ${orders.length} 筆訂單尚未完成！\n\n` + msg;
  }
  if(!confirm(msg)) return;
  await fetch('/api/admin/reset-counter', { method:'POST' });
  showToast('已重設，明天從 No.01 開始');
};

loadOrders();
loadSummary();
</script>
</body>
</html>
